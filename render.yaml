services:
  - type: web
    name: cityservice
    runtime: node
    plan: starter
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: cityservice-db
          property: connectionString
      - key: PROBE_SECRET
        sync: false

databases:
  - name: cityservice-db
    plan: starter
