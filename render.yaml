services:
  - type: web
    name: cityservice
    runtime: node
    plan: starter
    healthCheckPath: /api/health
    # npm install, not npm ci: the lockfile is generated on Windows and
    # newer npm on Linux refuses a clean install when optional platform
    # binaries (Rollup/esbuild) are missing from the lockfile.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: cityservice-db
          property: connectionString
      - key: PROBE_SECRET
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false

databases:
  - name: cityservice-db
    plan: starter
